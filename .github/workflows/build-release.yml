name: Build and Release AndroidCam HD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build APK with Gradle Wrapper
        working-directory: ./android_app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p artifacts
          APK_PATH=$(find android_app/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" artifacts/AndroidCamHD.apk
            echo "Found APK at $APK_PATH"
          else
            echo "APK not found!" && exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCamHD-Android-APK
          path: artifacts/AndroidCamHD.apk

  build-windows:
    name: Build Windows Single EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Single EXE with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "AndroidCamHD" --add-data "web;web" --add-data "driver;driver" --collect-all pyvirtualcam --collect-all cv2 --collect-all qrcode --collect-all aiohttp --collect-all pystray --collect-all psutil main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCamHD-Windows-EXE
          path: dist/AndroidCamHD.exe

  create-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: AndroidCamHD-Android-APK
          path: release_assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: AndroidCamHD-Windows-EXE
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AndroidCam HD v1.0.0 - 1080p/4K Camera Streamer"
          body: |
            ## 🚀 AndroidCam HD v1.0.0

            High-Definition (1080p / 4K) DroidCam Alternative for Android & Windows.
            - **Single Standalone EXE**: Just double-click `AndroidCamHD.exe` on any Windows PC. No scripts, no bat files, everything auto-installs internally!
            - **No 480p limitation**: Full 1080p / 4K @ 30/60fps.
            - **100% Offline**: Works over Local Wi-Fi, Hotspot, or Tailscale private IP.
            - **Zero Cloud Logins**: No accounts, completely private.
            - **DirectShow Virtual Camera**: Seamlessly works with Zoom, Microsoft Teams, Google Meet, Discord, OBS.

            ### 📥 Downloads
            - 💻 **Windows (Single Standalone EXE)**: [`AndroidCamHD.exe`](https://github.com/Srinu-ui-cpu/androidcam-hd/releases/download/v1.0.0/AndroidCamHD.exe)
            - 📱 **Android (Native APK)**: [`AndroidCamHD.apk`](https://github.com/Srinu-ui-cpu/androidcam-hd/releases/download/v1.0.0/AndroidCamHD.apk)
          draft: false
          prerelease: false
          files: |
            release_assets/AndroidCamHD.apk
            release_assets/AndroidCamHD.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
