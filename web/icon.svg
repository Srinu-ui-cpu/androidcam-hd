<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Camera Body -->
  <rect x="96" y="160" width="320" height="230" rx="44" fill="#0f172a" stroke="#38bdf8" stroke-width="8" />
  <path d="M 176 160 L 206 112 L 306 112 L 336 160 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round" />
  <!-- Camera Lens Outer -->
  <circle cx="256" cy="275" r="75" fill="url(#lensGrad)" stroke="#38bdf8" stroke-width="7" />
  <!-- Lens Glass Flare -->
  <circle cx="256" cy="275" r="50" fill="#0c4a6e" />
  <circle cx="240" cy="255" r="24" fill="#38bdf8" opacity="0.75" filter="url(#glow)" />
  <circle cx="275" cy="295" r="10" fill="#7dd3fc" opacity="0.6" />
  <!-- HD Tag -->
  <rect x="305" y="185" width="85" height="34" rx="8" fill="#ef4444" />
  <text x="347" y="209" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">HD 4K</text>
  <!-- Live Indicator Dot -->
  <circle cx="135" cy="202" r="10" fill="#22c55e" filter="url(#glow)" />
</svg>
